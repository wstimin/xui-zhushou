name: Build release package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run type checks
        run: npm run lint

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Build production application
        run: npm run build

      - name: Prepare release package
        run: npm run package:release

      - name: Verify terminal installation without a web wizard
        run: node scripts/smoke-standalone.mjs

      - name: Embed trusted release public key
        env:
          PANELARK_RELEASE_PRIVATE_KEY: ${{ secrets.PANELARK_RELEASE_PRIVATE_KEY }}
        run: node scripts/sign-release.mjs --public-only

      - name: Bundle production dependencies for fast offline updates
        run: npm ci --prefix release/package --omit=dev --ignore-scripts

      - name: Read release version
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          test "$version" = "$lock_version" || {
            echo "package.json version $version does not match package-lock.json version $lock_version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify source upload and automatic first-start build
        shell: bash
        run: |
          source_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$source_dir"
          token="$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('hex'))")"
          cd "$source_dir"
          PORT=1890 HOST=127.0.0.1 PANELARK_SETUP_TOKEN="$token" node panel.cjs > "$source_dir/start.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:1890/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          PANELARK_SMOKE_SETUP_TOKEN="$token" node "$GITHUB_WORKSPACE/scripts/smoke-web-install.mjs" http://127.0.0.1:1890

      - name: Verify panel container and web installation
        shell: bash
        run: |
          docker compose config -q
          PANELARK_PROXY_NETWORK=panelark-smoke-network docker compose -f docker-compose.yml -f deploy/compose.1panel.yml config -q
          docker build -t panelark-release-smoke release/package
          docker run -d --name panelark-release-smoke -p 127.0.0.1:1889:1888 panelark-release-smoke
          trap 'docker rm -f panelark-release-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1889/api/health >/dev/null; then break; fi
            sleep 1
          done
          PANELARK_SMOKE_SETUP_TOKEN="$(docker exec panelark-release-smoke cat /app/data/admin-setup-token.txt)" node scripts/smoke-web-install.mjs http://127.0.0.1:1889
          docker restart panelark-release-smoke
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1889/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-web-install.mjs http://127.0.0.1:1889 --verify-installed

      - name: Require a new version for every main push
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Version $tag has already been released. Update package.json and package-lock.json before pushing main."
            exit 1
          fi

      - name: Verify release package
        shell: bash
        run: |
          test -s release/package/VERSION
          test -s release/package/dist/server.cjs
          test -s release/package/dist/panel-admin.cjs
          test -s release/package/dist/index.html
          test -s release/package/install.sh
          test -s release/package/package-lock.json
          test -s release/package/release-public-key.pem
          test -s release/package/node_modules/express/package.json
          test -s release/package/node_modules/sql.js/dist/sql-wasm.wasm
          test -s release/package/scripts/apply-update.mjs
          test -s release/package/panel.cjs
          test -s release/package/scripts/panel-start.mjs
          test -s release/package/Dockerfile
          test -s release/package/docs/deployment/README.md
          test ! -e release/package/dist/server.cjs.map
          test ! -e release/package/server.ts
          test ! -e release/package/src

      - name: Create archives and checksums
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tar -C release/package -czf "release/xui-zhushou-linux-v${version}.tar.gz" .
          cp "release/xui-zhushou-linux-v${version}.tar.gz" release/xui-zhushou-linux.tar.gz
          (cd release/package && zip -qr "../xui-zhushou-panel-v${version}.zip" .)
          cp "release/xui-zhushou-panel-v${version}.zip" release/xui-zhushou-panel.zip

      - name: Sign release and adapter manifests
        env:
          PANELARK_RELEASE_PRIVATE_KEY: ${{ secrets.PANELARK_RELEASE_PRIVATE_KEY }}
          PANELARK_RELEASE_CHANNEL: stable
          PANELARK_RELEASE_NOTES: "Clear stale update progress safely|Stable channel only|Stop terminal progress animation|Prevent accidental downgrade"
        run: node scripts/sign-release.mjs

      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum xui-zhushou-linux*.tar.gz xui-zhushou-panel*.zip adapter-catalog.json release-manifest.json > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xui-zhushou-linux-${{ steps.release.outputs.tag }}
          path: |
            release/xui-zhushou-linux*.tar.gz
            release/xui-zhushou-panel*.zip
            release/SHA256SUMS
            release/release-manifest.json
            release/adapter-catalog.json
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/xui-zhushou-linux*.tar.gz
            release/xui-zhushou-panel*.zip
            release/SHA256SUMS
            release/release-manifest.json
            release/adapter-catalog.json
