name: Build release package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run type checks
        run: npm run lint

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Build production application
        run: npm run build

      - name: Prepare release package
        run: npm run package:release

      - name: Embed trusted release public key
        env:
          PANELARK_RELEASE_PRIVATE_KEY: ${{ secrets.PANELARK_RELEASE_PRIVATE_KEY }}
        run: node scripts/sign-release.mjs --public-only

      - name: Read release version
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          test "$version" = "$lock_version" || {
            echo "package.json version $version does not match package-lock.json version $lock_version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require a new version for every main push
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Version $tag has already been released. Update package.json and package-lock.json before pushing main."
            exit 1
          fi

      - name: Verify release package
        shell: bash
        run: |
          test -s release/package/VERSION
          test -s release/package/dist/server.cjs
          test -s release/package/dist/index.html
          test -s release/package/install.sh
          test -s release/package/package-lock.json
          test -s release/package/release-public-key.pem
          test -s release/package/scripts/apply-update.mjs
          test ! -e release/package/dist/server.cjs.map
          test ! -e release/package/server.ts
          test ! -e release/package/src

      - name: Create archives and checksums
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tar -C release/package -czf "release/xui-zhushou-linux-v${version}.tar.gz" .
          cp "release/xui-zhushou-linux-v${version}.tar.gz" release/xui-zhushou-linux.tar.gz

      - name: Sign release and adapter manifests
        env:
          PANELARK_RELEASE_PRIVATE_KEY: ${{ secrets.PANELARK_RELEASE_PRIVATE_KEY }}
          PANELARK_RELEASE_CHANNEL: stable
          PANELARK_RELEASE_NOTES: "Signed online update|Pre-update encrypted backup|Automatic health-check rollback"
        run: node scripts/sign-release.mjs

      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum xui-zhushou-linux*.tar.gz adapter-catalog.json release-manifest.json > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xui-zhushou-linux-${{ steps.release.outputs.tag }}
          path: |
            release/xui-zhushou-linux*.tar.gz
            release/SHA256SUMS
            release/release-manifest.json
            release/adapter-catalog.json
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/xui-zhushou-linux*.tar.gz
            release/SHA256SUMS
            release/release-manifest.json
            release/adapter-catalog.json
