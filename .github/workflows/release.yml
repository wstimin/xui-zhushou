name: Build release package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checks
        run: npm run lint

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Build production application
        run: npm run build

      - name: Prepare release package
        run: npm run package:release

      - name: Embed trusted release public key
        env:
          PANELARK_RELEASE_PRIVATE_KEY: ${{ secrets.PANELARK_RELEASE_PRIVATE_KEY }}
        run: node scripts/sign-release.mjs --public-only

      - name: Read release version
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify release package
        shell: bash
        run: |
          test -s release/package/VERSION
          test -s release/package/dist/server.cjs
          test -s release/package/dist/index.html
          test -s release/package/install.sh
          test -s release/package/package-lock.json
          test -s release/package/release-public-key.pem
          test -s release/package/scripts/apply-update.mjs
          test ! -e release/package/dist/server.cjs.map
          test ! -e release/package/server.ts
          test ! -e release/package/src

      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version" || {
            echo "Tag v$tag_version does not match package version $package_version"
            exit 1
          }

      - name: Create archives and checksums
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tar -C release/package -czf "release/xui-zhushou-linux-v${version}.tar.gz" .
          cp "release/xui-zhushou-linux-v${version}.tar.gz" release/xui-zhushou-linux.tar.gz

      - name: Sign release and adapter manifests
        env:
          PANELARK_RELEASE_PRIVATE_KEY: ${{ secrets.PANELARK_RELEASE_PRIVATE_KEY }}
          PANELARK_RELEASE_CHANNEL: stable
          PANELARK_RELEASE_NOTES: "Signed online update|Pre-update encrypted backup|Automatic health-check rollback"
        run: node scripts/sign-release.mjs

      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum xui-zhushou-linux*.tar.gz adapter-catalog.json release-manifest.json > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xui-zhushou-linux-${{ github.sha }}
          path: |
            release/xui-zhushou-linux*.tar.gz
            release/SHA256SUMS
            release/release-manifest.json
            release/adapter-catalog.json
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            release/xui-zhushou-linux*.tar.gz
            release/SHA256SUMS
            release/release-manifest.json
            release/adapter-catalog.json
